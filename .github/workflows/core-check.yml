name: core-check

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:

jobs:
  javac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile dependency-free VayCore
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find vay-core/src/main/java -name '*.java')
      - name: Run settings smoke test
        run: java -cp out app.vaygram.core.demo.Demo
