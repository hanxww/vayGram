name: android-compile-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vay-core/**"
      - "vay-android/**"
      - "telegram-integration/**"
      - "scripts/bootstrap-telegram.sh"
      - "scripts/apply-vaygram-branding.sh"
      - "scripts/compile-android-overlay.sh"
      - ".github/workflows/android-compile-check.yml"

concurrency:
  group: android-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Compile vayGram Android overlay
        run: bash scripts/compile-android-overlay.sh
