name: dev-apk

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 27 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/build-dev-apk')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VAYGRAM_API_ID: ${{ secrets.VAYGRAM_API_ID }}
      VAYGRAM_API_HASH: ${{ secrets.VAYGRAM_API_HASH }}
      VAYGRAM_FIREBASE_JSON_BASE64: ${{ secrets.VAYGRAM_FIREBASE_JSON_BASE64 }}
      VAYGRAM_SIGNING_KEYSTORE_BASE64: ${{ secrets.VAYGRAM_SIGNING_KEYSTORE_BASE64 }}
      VAYGRAM_KEYSTORE_PASSWORD: ${{ secrets.VAYGRAM_KEYSTORE_PASSWORD }}
      VAYGRAM_KEY_ALIAS: ${{ secrets.VAYGRAM_KEY_ALIAS }}
      VAYGRAM_KEY_PASSWORD: ${{ secrets.VAYGRAM_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preflight
        run: bash scripts/preflight-build.sh

      - name: Install Android SDK components
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Restore persistent dev signing key
        if: env.VAYGRAM_SIGNING_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p .work/keys
          printf '%s' "$VAYGRAM_SIGNING_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode \
            > .work/keys/vaygram-dev.keystore
          if ! keytool -list \
            -keystore .work/keys/vaygram-dev.keystore \
            -storepass "$VAYGRAM_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Signing keystore could not be opened. Check VAYGRAM_SIGNING_KEYSTORE_BASE64 and VAYGRAM_KEYSTORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list \
            -keystore .work/keys/vaygram-dev.keystore \
            -storepass "$VAYGRAM_KEYSTORE_PASSWORD" \
            -alias "$VAYGRAM_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Signing key alias was not found. Check VAYGRAM_KEY_ALIAS."
            exit 1
          fi
          echo "VAYGRAM_DEV_KEYSTORE=$GITHUB_WORKSPACE/.work/keys/vaygram-dev.keystore" >> "$GITHUB_ENV"

      - name: Build vayGram 0.1-dev APK
        run: bash scripts/build-dev-apk.sh

      - name: Show build metadata
        run: cat .work/artifacts/vayGram-0.1-dev-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vayGram-0.1-dev
          path: |
            .work/artifacts/vayGram-0.1-dev.apk
            .work/artifacts/vayGram-0.1-dev.sha256
            .work/artifacts/vayGram-0.1-dev-build-info.txt
          if-no-files-found: error

      - name: Report owner-triggered build result
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          BUILD_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          if [[ "$BUILD_STATUS" == "success" ]]; then
            MARK="✅"
          else
            MARK="❌"
          fi
          BODY="$(printf '%s dev-apk %s for %s: %s/%s/actions/runs/%s' \
            "$MARK" "$BUILD_STATUS" "$BUILD_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$BODY"
